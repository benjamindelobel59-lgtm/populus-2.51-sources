<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Forge · Atelier Mystic</title>
<meta name="description" content="La Forge, l'atelier Mystic : forge ton stuff, panoplies, établi de craft relié à tes personnages, recherche d'objets, bestiaire et codex du serveur.">
<meta name="theme-color" content="#07060b">
<link rel="icon" href="img/logo_mystic_700.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,500;0,600;0,700;1,700&family=Rubik:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/atelier.css">
</head>
<body>

<div class="forge">
  <aside class="side" id="side">
    <a class="side-logo" href="#builder"><img src="img/logo_mystic_700.png" alt=""><span><b>LA FORGE</b><small>ATELIER MYSTIC</small></span></a>
    <nav class="side-nav" aria-label="Atelier">
      <div class="g">FORGER</div>
      <a href="#builder" data-vue="builder"><i>⚒</i><span>Mon stuff</span></a>
      <a href="#panoplies" data-vue="panoplies"><i>◈</i><span>Panoplies</span><em id="nbPanos"></em></a>
      <a href="#craft" data-vue="craft"><i>✂</i><span>Établi de craft</span></a>
      <div class="g">SAVOIR</div>
      <a href="#recherche" data-vue="recherche"><i>⌕</i><span>Chercher un objet</span></a>
      <a href="#bestiaire" data-vue="bestiaire"><i>☠</i><span>Bestiaire</span><em id="nbMonstres"></em></a>
      <a href="#encyclopedie" data-vue="encyclopedie"><i>▤</i><span>Codex</span><em id="nbObjets"></em></a>
      <div class="g">MOI</div>
      <a href="#armoire" data-vue="armoire"><i>▣</i><span>Armoire</span><em id="nbStuffs"></em></a>
    </nav>
    <button class="side-stuff" id="choixStuff" type="button" aria-haspopup="menu"><small>STUFF ACTIF</small><span id="choixStuffNom">—</span><i>⇅</i></button>
    <div class="side-lie" id="persosLies"></div>
    <a class="side-retour" href="index.html">← Retour au site Mystic</a>
  </aside>

  <div class="zone">
    <main class="at-main" id="vue"><div class="at-charge">Chargement des données du serveur…</div></main>
    <footer class="at-pied" id="pied">Données issues du serveur Mystic.</footer>
  </div>
</div>

<aside class="at-tiroir" id="tiroir" hidden><div class="at-tiroir-in" id="tiroirIn"></div></aside>
<div class="at-voile" id="voile" hidden></div>
<div class="at-modale" id="modale" hidden role="dialog" aria-modal="true"><div class="at-modale-in" id="modaleIn"></div></div>
<div class="at-menu" id="menuFlottant" hidden role="menu"></div>
<div class="at-toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/atelier.js"></script>
</body>
</html>
